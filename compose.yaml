name: shopee-clone

services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-shopee_clone_test}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:?POSTGRES_PORT is required}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s
    labels:
      com.shopee-clone.component: postgres
      com.shopee-clone.scope: ${SHOPEE_COMPOSE_SCOPE:-development}

  api:
    image: datnguyen10102004/shopee-clone-api:${IMAGE_TAG:-0.1.0}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # Process always listens on 3001 inside the container.
      # Host publish port can still be 80 via PORT / API_HOST_PORT in .env.
      PORT: '3001'
      DATABASE_URL: ${DATABASE_CONTAINER_URL:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}}
    ports:
      - '${API_HOST_PORT:-3001}:3001'
    labels:
      com.shopee-clone.component: api
      com.shopee-clone.scope: ${SHOPEE_COMPOSE_SCOPE:-development}

volumes:
  postgres-data:
    labels:
      com.shopee-clone.component: postgres-data
      com.shopee-clone.scope: ${SHOPEE_COMPOSE_SCOPE:-development}
