name: CI

on:
  # Automatic CI is temporarily paused. Run this workflow explicitly when needed.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.12.0
  PNPM_VERSION: 10.34.5

jobs:
  repository-quality:
    name: Repository quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Validate infrastructure and CI definitions
        run: |
          pnpm infra:config:example
          pnpm ci:validate

      - name: Check Prisma schema and generated client
        run: |
          pnpm db:format
          git diff --exit-code -- apps/api/prisma/schema.prisma
          pnpm db:validate
          pnpm db:generate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run database-independent tests
        run: pnpm test

      - name: Build production applications and packages
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run real API-driven homepage browser and accessibility checks
        run: pnpm test:e2e:homepage

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  persistence-smoke:
    name: PostgreSQL persistence smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Run isolated infrastructure smoke verification
        run: pnpm infra:smoke

      - name: Confirm smoke resources were removed
        if: always()
        shell: bash
        run: |
          leftovers="$({
            docker ps --all --format '{{.Names}}'
            docker network ls --format '{{.Name}}'
            docker volume ls --format '{{.Name}}'
          } | grep '^shopee-clone-smoke-' || true)"
          if [[ -n "$leftovers" ]]; then
            echo 'Isolated smoke resources remain after verification:'
            echo "$leftovers"
            exit 1
          fi

  chat-integration:
    name: Floating chat PostgreSQL and realtime gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CHAT_DB_USER: shopee_chat_ci
      CHAT_DB_PASSWORD: shopee_chat_ci_password_2026
      CHAT_DB_NAME: shopee_chat_ci
      PORT: 3001
      E2E_WEB_PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3001
      AUTH_ALLOWED_ORIGINS: http://127.0.0.1:3000
      AUTH_WEB_BASE_URL: http://127.0.0.1:3000
      AUTH_COOKIE_SECURE: 'false'
      AUTH_RECOVERY_MODE: capture
      GOOGLE_CLIENT_ID: ci-client.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-only-google-client-secret-2026
      GOOGLE_CALLBACK_URL: http://127.0.0.1:3001/login/oauth2/code/google
      RUN_CHAT_DATABASE_TESTS: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Start isolated PostgreSQL and configure test URLs
        run: |
          docker run --detach --name shopee-chat-postgres --publish 5432:5432 \
            --env POSTGRES_USER="$CHAT_DB_USER" --env POSTGRES_PASSWORD="$CHAT_DB_PASSWORD" \
            --env POSTGRES_DB="$CHAT_DB_NAME" postgres:18.4-alpine
          for attempt in {1..30}; do
            if docker exec shopee-chat-postgres pg_isready -U "$CHAT_DB_USER" -d "$CHAT_DB_NAME"; then break; fi
            sleep 2
          done
          db_scheme=postgresql
          echo "DATABASE_URL=${db_scheme}://${CHAT_DB_USER}:${CHAT_DB_PASSWORD}@127.0.0.1:5432/${CHAT_DB_NAME}" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=${db_scheme}://${CHAT_DB_USER}:${CHAT_DB_PASSWORD}@127.0.0.1:5432/${CHAT_DB_NAME}" >> "$GITHUB_ENV"

      - name: Apply schema and seed deterministic marketplace
        run: |
          pnpm db:generate
          pnpm db:migrate:deploy
          pnpm db:seed

      - name: Run non-skippable PostgreSQL chat suite
        run: pnpm test:chat:database

      - name: Build API and web for real browser transport
        run: pnpm build

      - name: Run real two-account Socket.IO chat journeys
        env:
          CHAT_E2E_PREPARE: '1'
        run: pnpm test:chat:real

      - name: Remove isolated PostgreSQL
        if: always()
        run: docker rm --force shopee-chat-postgres
