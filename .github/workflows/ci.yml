name: CI

on:
  # Automatic CI is temporarily paused. Run this workflow explicitly when needed.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.12.0
  PNPM_VERSION: 10.34.5

jobs:
  repository-quality:
    name: Repository quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Validate infrastructure and CI definitions
        run: |
          pnpm infra:config:example
          pnpm ci:validate

      - name: Check Prisma schema and generated client
        run: |
          pnpm db:format
          git diff --exit-code -- apps/api/prisma/schema.prisma
          pnpm db:validate
          pnpm db:generate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run database-independent tests
        run: pnpm test

      - name: Build production applications and packages
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run real API-driven homepage browser and accessibility checks
        run: pnpm test:e2e:homepage

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  persistence-smoke:
    name: PostgreSQL persistence smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Run isolated infrastructure smoke verification
        run: pnpm infra:smoke

      - name: Confirm smoke resources were removed
        if: always()
        shell: bash
        run: |
          leftovers="$({
            docker ps --all --format '{{.Names}}'
            docker network ls --format '{{.Name}}'
            docker volume ls --format '{{.Name}}'
          } | grep '^shopee-clone-smoke-' || true)"
          if [[ -n "$leftovers" ]]; then
            echo 'Isolated smoke resources remain after verification:'
            echo "$leftovers"
            exit 1
          fi
